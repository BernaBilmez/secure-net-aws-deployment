# /etc/nginx/conf.d/securenet.conf
# Reverse proxy virtual host for the SecureNet OpsCenter Flask app.
# Nginx listens on port 80 and forwards requests to the Flask/Werkzeug
# development server bound to 127.0.0.1:5000.

server {
    listen 80;
    server_name 18.132.12.61 ec2-18-132-12-61.eu-west-2.compute.amazonaws.com;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
